[package]
name = "sentinel-audit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Append-only audit trail of Sentinel swarm verdicts (EU AI Act Art. 12 record keeping)"

[dependencies]
concordium-std = "11.0"

[dev-dependencies]
concordium-smart-contract-testing = "5.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "s"
